services:
  - type: web
    name: webgis-tvdi-tphcm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: tvdi-webgis-db
          property: connectionString

databases:
  - name: tvdi-webgis-db
    databaseName: tvdi_webgis
    user: tvdi_user
    plan: free
